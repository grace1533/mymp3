name: Keep Supabase Alive

on:
  schedule:
    # 每天运行两次：北京时间上午 9 点和下午 9 点
    # UTC 时间 1:00 和 13:00 = 北京时间 9:00 和 21:00
    - cron: '0 8 */1 * *'
  workflow_dispatch: # 允许手动触发（方便测试）

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    environment: production  # 如果使用 environment 保护 secrets（可选）

    steps:
      # 步骤1: 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2: 设置 Bun 运行环境
      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 步骤3: 安装项目依赖
      - name: 安装依赖
        run: bun install

      # 步骤4: 执行保活脚本（注入环境变量）
      - name: 执行保活脚本
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: bun run scripts/keep-alive.ts

      # 步骤5: 记录执行时间（无论成功失败都执行）
      - name: 记录执行时间
        if: always()
        run: echo "保活任务执行完成于 $(date '+%Y-%m-%d %H:%M:%S')"
